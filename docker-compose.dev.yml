services:
  postgres:
    image: postgres:16-alpine
    container_name: safehouse-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: safehouse
      POSTGRES_PASSWORD: safehouse
      POSTGRES_DB: safehouse
    ports:
      - "5432:5432"
    volumes:
      - safehouse_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safehouse -d safehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  safehouse_pgdata_dev:
